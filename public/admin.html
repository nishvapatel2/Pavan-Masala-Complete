<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pavan Masala — Order Management</title>
<style>
:root{font-family:Arial,sans-serif;color:#29231f;background:#fffaf0}*{box-sizing:border-box}body{margin:0;padding:24px}.wrap{max-width:1100px;margin:auto}h1{color:#8d2117}.panel{background:white;border:1px solid #eadfcf;border-radius:12px;padding:18px;margin:18px 0}input,button,select{font:inherit;padding:10px;border:1px solid #cfc2b2;border-radius:6px}button{background:#8d2117;color:white;border:0;cursor:pointer}button:disabled{opacity:.6}table{width:100%;border-collapse:collapse;min-width:780px}th,td{text-align:left;padding:10px;border-bottom:1px solid #eee;vertical-align:top}th{background:#f5ead8}.table-scroll{overflow:auto}.muted{color:#6f665d}.error{color:#a21c16}.success{color:#286c35}.order-items{font-size:13px;line-height:1.5}#message{margin-left:8px}
</style></head><body><main class="wrap"><h1>Pavan Masala — Order Management</h1><p class="muted">Local project admin dashboard. Keep your admin key private and do not publish it to GitHub.</p>
<section class="panel"><label for="adminKey"><strong>Admin key</strong></label> <input id="adminKey" type="password" placeholder="Enter ADMIN_KEY from .env" autocomplete="current-password"><button id="loadBtn">Load orders</button> <button id="subscriberBtn">Load subscribers</button><span id="message" role="status"></span></section>
<section class="panel"><h2>Customer orders</h2><div class="table-scroll"><table><thead><tr><th>Order</th><th>Date</th><th>Customer</th><th>Items</th><th>Total</th><th>Status</th><th>Update</th></tr></thead><tbody id="orders"><tr><td colspan="7">Enter the admin key and load orders.</td></tr></tbody></table></div></section>
<section class="panel"><h2>Newsletter subscribers</h2><div id="subscribers" class="muted">Click “Load subscribers” to view saved emails.</div></section></main>
<script>
const keyInput=document.getElementById('adminKey');
const message=document.getElementById('message');
const statusOptions=['Received','Confirmed','Packed','Shipped','Delivered','Cancelled'];
function setMessage(text,ok=false){message.textContent=text;message.className=ok?'success':'error';}
function money(n){return new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR'}).format(Number(n)||0)}
async function api(url,options={}){const response=await fetch(url,{...options,headers:{'Content-Type':'application/json','x-admin-key':keyInput.value,...(options.headers||{})}});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||'Request failed');return data;}
async function loadOrders(){setMessage('Loading…');try{const orders=await api('/api/admin/orders');const body=document.getElementById('orders');if(!orders.length){body.innerHTML='<tr><td colspan="7">No orders yet.</td></tr>';setMessage('No orders found.',true);return;}body.innerHTML=orders.map(o=>`<tr><td>#${o.id}</td><td>${escapeHtml(o.created_at)}</td><td><strong>${escapeHtml(o.customer_name)}</strong><br>${escapeHtml(o.phone)}<br>${escapeHtml(o.city)}<br>${escapeHtml(o.address)}</td><td class="order-items">${o.items.map(i=>`${escapeHtml(i.name)} × ${i.quantity} (${money(i.lineTotal)})`).join('<br>')}</td><td>${money(o.total)}</td><td>${escapeHtml(o.status)}</td><td><select id="status-${o.id}">${statusOptions.map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select><br><button onclick="updateStatus(${o.id})">Save status</button></td></tr>`).join('');setMessage(`Loaded ${orders.length} order(s).`,true);}catch(e){setMessage(e.message);}}
async function updateStatus(id){try{const status=document.getElementById('status-'+id).value;await api('/api/admin/orders/'+id,{method:'PATCH',body:JSON.stringify({status})});setMessage('Order #'+id+' updated.',true);await loadOrders();}catch(e){setMessage(e.message);}}
async function loadSubscribers(){setMessage('Loading…');try{const list=await api('/api/admin/subscribers');document.getElementById('subscribers').innerHTML=list.length?'<ul>'+list.map(x=>`<li>${escapeHtml(x.email)} <span class="muted">— ${escapeHtml(x.subscribedAt)}</span></li>`).join('')+'</ul>':'No subscribers yet.';setMessage(`Loaded ${list.length} subscriber(s).`,true);}catch(e){setMessage(e.message);}}
function escapeHtml(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
document.getElementById('loadBtn').addEventListener('click',loadOrders);document.getElementById('subscriberBtn').addEventListener('click',loadSubscribers);
</script></body></html>
